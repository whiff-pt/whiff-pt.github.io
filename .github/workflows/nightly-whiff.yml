name: Nightly whiff check

on:
  schedule:
    # 22:00 UTC = 3pm PDT / 2pm PST — a useful heads-up before the evening.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Send even if below threshold
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Score tonight and notify
        env:
          # Repository secret containing the whole notifier config as JSON.
          # Settings → Secrets and variables → Actions → New repository secret.
          WHIFF_CONFIG_JSON: ${{ secrets.WHIFF_CONFIG_JSON }}
        run: node notifier/notify.mjs ${{ inputs.force && '--force' || '' }}
